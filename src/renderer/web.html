<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scrim editor · live demo</title>
    <link rel="icon" href="../favicon.png" />
  </head>
  <body>
    <div id="root">
      <!-- shown only if the editor can't start (it replaces this when it loads) -->
      <div style="min-height:100vh;display:grid;place-content:center;justify-items:center;gap:14px;padding:24px;text-align:center;background:#0a0a0a;color:#f5f5f4;font:16px/1.55 system-ui,sans-serif">
        <img src="../img/icon.png" alt="" style="width:56px;height:56px;border-radius:14px" />
        <h1 style="margin:8px 0 0;font-size:26px;font-weight:600;letter-spacing:-0.02em">The live editor needs a web server</h1>
        <p style="margin:0;max-width:440px;color:#a3a3a0">Browsers don't let it load from a file on your computer. In the <b style="color:#fff">server/feedback</b> folder run <code style="background:#1c1c1f;padding:2px 6px;border-radius:6px;color:#fff">npm install</code> then <code style="background:#1c1c1f;padding:2px 6px;border-radius:6px;color:#fff">npm start</code>, and open <b style="color:#fff">localhost:3000/app</b>. On the real website it just works.</p>
        <a href="../index.html" style="margin-top:8px;padding:12px 22px;border-radius:999px;background:#fff;color:#0a0a0a;text-decoration:none;font-weight:600">Back to the website</a>
      </div>
    </div>
    <script type="module" src="/src/web/entry.tsx"></script>
  </body>
</html>
